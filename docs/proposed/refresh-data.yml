# PROPOSED workflow — .github/workflows/ is a protected path in this repo, so
# the OWNER must install this file (docs/architecture.md §7, critique M3):
#
#   git mv docs/proposed/refresh-data.yml .github/workflows/refresh-data.yml
#
# Owner install checklist (critique-2 M6'):
# 1. This repo deletes `dev` after each release merge — the workflow
#    recreates it from main when missing (step below), but if dev exists
#    with unmerged work, the PR diff will show that drift too.
# 2. Repo setting required: Actions → "Allow GitHub Actions to create and
#    approve pull requests".
# 3. PRs created with the default GITHUB_TOKEN do NOT trigger ci.yml
#    (token-cascade block). Either supply a PAT via the `token` input of
#    create-pull-request, or rely on the gates step below, whose output is
#    part of the PR body evidence.
# 4. GitHub disables scheduled workflows after ~60 days without repository
#    activity; re-enable under Actions, or rely on workflow_dispatch.
# 5. Until installed, the architecture's "monthly refresh surfaces site
#    breakage" mitigation is INACTIVE.

name: refresh-framework-data

on:
  schedule:
    - cron: "17 6 3 * *" # monthly, 3rd day 06:17 UTC (off the busy minute-0)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure dev branch exists (recreated from main when absent)
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.getRef({...context.repo, ref: "heads/dev"});
            } catch (e) {
              const main = await github.rest.git.getRef({...context.repo, ref: "heads/main"});
              await github.rest.git.createRef({...context.repo, ref: "refs/heads/dev", sha: main.data.object.sha});
            }
      - name: Run refresh (network crawl, no cache)
        id: refresh
        run: |
          npm run build
          node dist/crawlers/framework/cli.js refresh --no-cache --soft-counts \
            --report-dir .cache/crawl-report
      - name: Run gates on the refreshed artifact
        run: ./scripts/agentic gates --tier fast
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/framework; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open PR with diff report
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          base: dev
          branch: refresh/framework-data
          title: "Refresh FinOps Framework data artifact"
          commit-message: "Refresh framework data artifact from finops.org"
          body-path: .cache/crawl-report/diff-report.md
          labels: data-refresh
      - name: Open/refresh failure issue (critique M4)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Framework data refresh is failing";
            const {data: issues} = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "data-refresh-failure"});
            const body = `The scheduled refresh failed on ${new Date().toISOString()}.\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n` +
              `Likely causes: finops.org redesign (parse-quality budget), count assertions, network.`;
            if (issues.length) {
              await github.rest.issues.createComment({...context.repo, issue_number: issues[0].number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body, labels: ["data-refresh-failure"]});
            }
