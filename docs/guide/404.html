<!doctype html>
<!--
  docs/guide/404.html — GitHub Pages serves this for any unmatched path under
  the published site. docs/guide/ IS the site root (the pages workflow uploads
  only this directory), so this file sits at /404.html once deployed.

  The link below is root-relative, not relative, because a 404 is served for
  paths at any depth. It hardcodes the /finops-framework-mcp project prefix —
  a repo rename or a custom domain would need it updated (docs/deploy-pages.md).
-->
<html lang="en">
<head>

<style>
  :root {
    --paper: #F6F8F5; --ink: #16211B; --panel-2: #EDF2EE;
    --moss: #0B7A55; --slate: #56655C; --line: #C9D6CD;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131C17; --ink: #E8EFEA; --panel-2: #18241D;
      --moss: #34B98A; --slate: #9BAFA3; --line: #2E4036;
    }
  }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans);
    line-height: 1.55; margin: 0; display: grid; place-items: center;
    min-height: 100vh; padding: 1.25rem; box-sizing: border-box; }
  .box { max-width: 46ch; text-align: center; }
  .code { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.13em;
    text-transform: uppercase; color: var(--slate); }
  h1 { font-family: var(--serif); font-size: 1.6rem; font-weight: 600;
    margin: 0.3rem 0 0.5rem; }
  p { color: var(--slate); margin: 0 0 1.2rem; }
  a.go { display: inline-block; text-decoration: none; font-weight: 600;
    color: var(--moss); border: 1px solid var(--line); border-radius: 999px;
    padding: 0.45rem 1.1rem; background: var(--panel-2); }
</style>
</head>
<body>
<div class="box">
