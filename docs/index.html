<!doctype html>
<!--
  docs/index.html — the GitHub Pages site root.

  Pages serves this directory (main branch, /docs folder — see
  docs/deploy-pages.md). The published site's front door is the six-page
  usage guide in docs/guide/, so this file exists only to send / to
  /guide/. Everything else under docs/ is markdown and is served as-is
  (.nojekyll turns Jekyll off).

  Redirect belt and braces: <meta http-equiv="refresh"> covers no-JS,
  location.replace() avoids a history entry, and the visible link is the
  fallback if both are blocked.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="canonical" href="https://aaronmsoto.github.io/finops-framework-mcp/guide/">
<meta http-equiv="refresh" content="0; url=guide/index.html">
<style>
  :root {
    --paper: #F6F8F5; --ink: #16211B; --panel-2: #EDF2EE;
    --moss: #0B7A55; --slate: #56655C; --line: #C9D6CD;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131C17; --ink: #E8EFEA; --panel-2: #18241D;
      --moss: #34B98A; --slate: #9BAFA3; --line: #2E4036;
    }
  }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans);
    line-height: 1.55; margin: 0; display: grid; place-items: center;
    min-height: 100vh; padding: 1.25rem; box-sizing: border-box; }
  .box { max-width: 44ch; text-align: center; }
  h1 { font-family: var(--serif); font-size: 1.6rem; font-weight: 600;
    margin: 0 0 0.5rem; }
  p { color: var(--slate); margin: 0 0 1.2rem; }
  a.go { display: inline-block; text-decoration: none; font-weight: 600;
    color: var(--moss); border: 1px solid var(--line); border-radius: 999px;
    padding: 0.45rem 1.1rem; background: var(--panel-2); }
</style>
</head>
<body>
<div class="box">
  <h1>FinOps MCP Servers — Usage Guide</h1>

</div>

</html>
