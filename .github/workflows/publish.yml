# Publishes both npm packages on a version tag via npm trusted publishing
# (OIDC — no NPM_TOKEN secret; provenance is generated automatically).
# Prerequisite: each package must already exist on npm with a trusted
# publisher configured for this repo + this workflow file — see
# docs/release-runbook.md for the one-time bootstrap.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; runners may ship older.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish finops-framework-mcp
        run: npm publish --access public --provenance
      - name: Publish finops-focus-mcp
        run: npm publish --access public --provenance
        working-directory: packages/finops-focus-mcp
