# Deploys the six-page usage guide (docs/guide/) to GitHub Pages.
#
# .github/workflows/ is a protected path here — this file was installed by an
# explicitly owner-authorized task (T-066); agents do not edit it otherwise.
#
# Two things live outside this file, both owner-only — full checklist in
# docs/deploy-pages.md:
# 1. Repo must be public, or the account on GitHub Pro/Team/Enterprise.
#    Pages is unavailable for private repos on the Free plan.
# 2. Repo setting required: Settings → Pages → Source = "GitHub Actions".
#    Selecting a branch instead silently ignores this workflow, and its
#    folder options (/ or /docs) cannot express "publish docs/guide only".
#
# Publishes ONLY docs/guide/, at the site root. Nothing else under docs/ is
# served — that is deliberate: the internal review markdown
# (critique-*.md, final-status-review.md, …) stays off the public site.

name: pages

on:
  push:
    branches: [main]
    paths: ["docs/guide/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

# Least privilege: read the repo, mint the Pages OIDC token, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; let a running deploy finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fail if the guide is missing or incomplete
        # Cheap guard: a bad path filter or a moved directory would otherwise
        # publish an empty site over a working one.
        run: |
          for f in index.html framework-server.html focus-server.html \
                   example-showback.html example-esr.html \
                   example-forecasting.html 404.html; do
            test -s "docs/guide/$f" || { echo "missing docs/guide/$f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/guide
      - id: deployment
        uses: actions/deploy-pages@v4
