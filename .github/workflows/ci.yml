# Two-tier CI for agent-heavy development (see .agentic/docs/architecture.md and
# .agentic/docs/research/research-quality.md):
#
#   - gates-fast: runs on every PR push and on pushes to main. Cheap, minutes.
#     This is the signal agents iterate against, plus the approvals-drift check
#     and the anti-gaming integrity diff on PRs.
#   - gates-full: runs only on `merge_group` (merge queue) and pushes to main.
#     Full tier is paid only for changes actually landing, and merge-queue runs
#     test the *tentative merge commit* — the right semantics when many agent
#     PRs land concurrently. CI MUST listen to `merge_group` or queued PRs
#     never report their required checks (common setup trap).
#
# Branch protection / ruleset setup: require the check named "gates-fast"
# (the job name is the check name). Repos using a merge queue should also
# require "gates-full". The importable ruleset is generated by
# `./scripts/agentic approvals compile` into .github/rulesets/main-branch.json.
name: CI

on:
  pull_request:
    # "edited" matters: PR-creation tooling can auto-append attribution
    # footers that are scrubbed right after — without it, the body check
    # below only ever sees the stale creation snapshot.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Cancel superseded runs for PRs; never cancel main/merge-queue runs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the integrity gate and diff-cover diff against base refs.
          fetch-depth: 0

      # Owner policy: no AI attribution in git artifacts — including PR
      # bodies. PR-creation tooling has been observed auto-appending
      # "Generated by/with ..." footers AFTER the submitted body, so this is
      # checked server-side rather than trusted to authors. Body is passed
      # via env (never interpolated into the script) so a malicious PR body
      # cannot inject shell.
      - name: PR body carries no AI attribution
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -qiE 'generated (with|by).*(claude|copilot)|claude\.ai/code|co-authored-by:.*(claude|copilot|anthropic)|🤖'; then
            echo "::error::PR body contains an AI-attribution footer (owner policy). Edit the PR description and remove it — tools may auto-append these after submission."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .agentic/harness/package-lock.json

      # Builds .agentic/harness/dist and sets core.hooksPath (harmless in CI).
      - name: Bootstrap harness
        run: ./scripts/bootstrap.sh

      # The PROJECT's own dependencies (the harness has its own). Fresh
      # projects: gates need your toolchain (eslint, vitest, ...) installed
      # at root. No-ops for the template itself (no root dependencies).
      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install
          fi

      - name: Run fast-tier gates
        run: ./scripts/agentic gates --tier fast

      # Policy (approvals.yaml) and its compiled enforcement surfaces must not drift.
      - name: Check approvals surfaces are in sync
        run: ./scripts/agentic approvals check

      # Anti-gaming diff checks against the PR base (deleted tests, focus markers, ...).
      - name: Integrity diff vs base
        if: github.event_name == 'pull_request'
        run: ./scripts/agentic integrity --base "origin/${{ github.base_ref }}"

  gates-full:
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .agentic/harness/package-lock.json

      - name: Bootstrap harness
        run: ./scripts/bootstrap.sh

      # The PROJECT's own dependencies (the harness has its own). Fresh
      # projects: gates need your toolchain (eslint, vitest, ...) installed
      # at root. No-ops for the template itself (no root dependencies).
      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install
          fi

      - name: Run all gates (fast + full tiers)
        run: ./scripts/agentic gates --tier all
