# CI split along two orthogonal axes (see .agentic/docs/architecture.md and
# .agentic/docs/research/research-quality.md):
#
#   Product vs governance (dependency axis — who can run it):
#   - Product jobs (gates-fast, gates-full) need only the root toolchain:
#     `npm ci` plus the same `npm run` scripts the agentic.config.json gate
#     entries invoke, so the two tiers cannot drift. They never touch
#     .agentic/, scripts/bootstrap.sh, or the harness binary — so they give
#     full signal on fork PRs (which get no secrets) and keep working
#     unchanged when the harness moves to a private npm package.
#   - The governance job runs the harness-implemented gates (designs,
#     integrity, memory), the approvals-drift check, the anti-gaming
#     integrity diff, and the PR-body attribution check. It acquires the
#     harness in exactly one step so the future npm swap is a one-line diff.
#
#   Fast vs full (cost axis — when it runs):
#   - gates-fast: runs on every PR push and on pushes to main/dev. Cheap,
#     minutes. This is the signal agents iterate against.
#   - gates-full: runs only on `merge_group` (merge queue) and pushes. Full
#     tier is paid only for changes actually landing, and merge-queue runs
#     test the *tentative merge commit* — the right semantics when many agent
#     PRs land concurrently. CI MUST listen to `merge_group` or queued PRs
#     never report their required checks (common setup trap).
#
# Branch protection / ruleset setup: require the check named "gates-fast"
# (the job name is the check name). Repos using a merge queue should also
# require "gates-full". "governance" may be added as a required check once a
# real fork PR has been observed reporting success — it always runs (no
# job-level `if:`, which would report "skipped" and never satisfy a required
# check); on fork PRs its harness steps detect the fork and exit 0. The
# importable ruleset is generated by `./scripts/agentic approvals compile`
# into .github/rulesets/main-branch.json.
name: CI

on:
  pull_request:
    # "edited" matters: PR-creation tooling can auto-append attribution
    # footers that are scrubbed right after — without it, the body check
    # below only ever sees the stale creation snapshot.
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, dev]
  merge_group:

permissions:
  contents: read

# Cancel superseded runs for PRs; never cancel main/merge-queue runs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Product, fast tier. Root toolchain only — no harness, no .agentic/.
  gates-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install project dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage thresholds live in vitest.config.ts, so a coverage
      # regression fails here like any other test failure.
      - name: Test
        run: npm test

  # Product, full tier: the build, only for changes actually landing.
  gates-full:
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install project dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Governance: harness gates + policy drift + anti-gaming checks. Always
  # runs — fork detection happens inside the harness steps (see header note).
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fork PRs get no secrets or trusted context, so once the harness is a
      # private npm package it cannot be acquired there. Harness steps consult
      # this and exit 0 instead of using a job-level `if:` — a skipped job
      # reports "skipped", which never satisfies a required status check.
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the integrity gate diffs against base refs.
          fetch-depth: 0

      # Owner policy: no AI attribution in git artifacts — including PR
      # bodies. PR-creation tooling has been observed auto-appending
      # "Generated by/with ..." footers AFTER the submitted body, so this is
      # checked server-side rather than trusted to authors. Body is passed
      # via env (never interpolated into the script) so a malicious PR body
      # cannot inject shell. Needs no harness, so it runs on fork PRs too.
      - name: PR body carries no AI attribution
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -qiE 'generated (with|by).*(claude|copilot)|claude\.ai/code|co-authored-by:.*(claude|copilot|anthropic)|🤖'; then
            echo "::error::PR body contains an AI-attribution footer (owner policy). Edit the PR description and remove it — tools may auto-append these after submission."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .agentic/harness/package-lock.json

      # THE harness-acquisition step: when the harness moves to a private
      # npm package, swapping this bootstrap for an npm install of that
      # package is the only change this workflow needs.
      - name: Acquire harness
        run: |
          if [ "$FORK_PR" = "true" ]; then
            echo "Fork PR: harness unavailable to forks; skipping so this check still reports a conclusion."
            exit 0
          fi
          ./scripts/bootstrap.sh

      - name: Run governance gates (designs, integrity, memory)
        run: |
          if [ "$FORK_PR" = "true" ]; then
            echo "Fork PR: harness unavailable to forks; skipping so this check still reports a conclusion."
            exit 0
          fi
          ./scripts/agentic gates designs integrity memory

      # Policy (approvals.yaml) and its compiled enforcement surfaces must not drift.
      - name: Check approvals surfaces are in sync
        run: |
          if [ "$FORK_PR" = "true" ]; then
            echo "Fork PR: harness unavailable to forks; skipping so this check still reports a conclusion."
            exit 0
          fi
          ./scripts/agentic approvals check

      # Anti-gaming diff checks against the PR base (deleted tests, focus markers, ...).
      - name: Integrity diff vs base
        if: github.event_name == 'pull_request'
        run: |
          if [ "$FORK_PR" = "true" ]; then
            echo "Fork PR: harness unavailable to forks; skipping so this check still reports a conclusion."
            exit 0
          fi
          ./scripts/agentic integrity --base "origin/${{ github.base_ref }}"
